name: 每日 KD 掃描

on:
  schedule:
    # UTC 07:30 = 台灣時間 15:30，週一到週五（收盤後）
    - cron: "30 7 * * 1-5"
  workflow_dispatch:   # 也可以在 Actions 頁面手動按 Run workflow

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scan.txt

      - name: 安裝套件
        run: pip install -r requirements-scan.txt

      - name: 掃描全市場並產生網頁
        run: python scan.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
